name: Build Cross-Platform Cyberdeck

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar Release no GitHub?'
        type: boolean
        default: true
      tag_name:
        description: 'Tag da versão (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Determinar Versão da Compilação
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      build_number: ${{ steps.get_version.outputs.build_number }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Calcular Versão Exata (SemVer Válido)
        id: get_version
        shell: bash
        run: |
          node -e "
            let rawTag = '';
            const eventName = '${{ github.event_name }}';
            const inputTag = '${{ github.event.inputs.tag_name }}';
            const gitRef = '${{ github.ref }}';
            const refName = '${{ github.ref_name }}';
            const runNum = '${{ github.run_number }}' || '1';

            if (eventName === 'workflow_dispatch' && inputTag) {
              rawTag = inputTag;
            } else if (gitRef.startsWith('refs/tags/')) {
              rawTag = refName;
            } else {
              // Push no branch (sem tag): extrai major e minor do package.json e usa github.run_number como patch
              const pkg = require('./package.json');
              const base = (pkg.version || '1.0.0').replace(/^v/, '');
              const parts = base.split('.');
              const major = parts[0] || '1';
              const minor = parts[1] || '0';
              rawTag = \`v\${major}.\${minor}.\${runNum}\`;
            }

            // Normaliza para formato SemVer estrito (X.Y.Z) exigido por electron-builder
            let clean = rawTag.replace(/^v/, '').trim();
            const segs = clean.split('.');
            if (segs.length > 3) {
              // Se vierem 4 partes como 1.0.0.10, condensa para 1.0.10
              clean = \`\${segs[0]}.\${segs[1]}.\${segs[segs.length - 1]}\`;
            } else if (segs.length === 2) {
              clean = \`\${segs[0]}.\${segs[1]}.0\`;
            } else if (segs.length === 1) {
              clean = \`\${segs[0]}.0.0\`;
            }

            const finalTag = 'v' + clean;
            const fs = require('fs');
            const outputFile = process.env.GITHUB_OUTPUT;
            fs.appendFileSync(outputFile, \`version=\${clean}\n\`);
            fs.appendFileSync(outputFile, \`tag=\${finalTag}\n\`);
            fs.appendFileSync(outputFile, \`build_number=\${runNum}\n\`);
            console.log(\`=== Versão SemVer calculada: \${clean} | Tag: \${finalTag} | Build #\${runNum} ===\`);
          "

  build:
    name: Build para ${{ matrix.os-name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows (.exe)
            builder-args: --win --x64
          - os: ubuntu-latest
            os-name: Linux (.AppImage)
            builder-args: --linux AppImage
          - os: macos-latest
            os-name: macOS (.dmg / .zip - Universal, Apple Silicon & Intel)
            builder-args: --mac --universal --arm64 --x64

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar Versão nos Arquivos do Projeto
        shell: bash
        run: node scripts/set-version.js "${{ needs.prepare.outputs.version }}"

      - name: Instalar Dependências
        shell: bash
        run: |
          # Remove package-lock.json gerado em outro OS para evitar o bug do npm (#4828) que omite binários nativos do Rolldown
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Garantir Binários Nativos da Plataforma (Vite/Rolldown)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm install --no-save @rolldown/binding-win32-x64-msvc@1.2.15 || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm install --no-save @rolldown/binding-darwin-arm64@1.2.15 @rolldown/binding-darwin-x64@1.2.15 || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npm install --no-save @rolldown/binding-linux-x64-gnu@1.2.15 || true
          fi

      - name: Instalar Dependências de Sistema para Empacotamento (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update || true
          sudo apt-get install -y libfuse2t64 libfuse2 libnss3 libatk1.0-0 libatk-bridge2.0-0 libcups2 libgtk-3-0 libasound2t64 libasound2 || true

      - name: Compilar Frontend (Vite)
        run: npm run build

      - name: Limpar atributos estendidos (macOS)
        if: runner.os == 'macOS'
        run: xattr -cr . || true

      - name: Compilar Aplicativo Desktop (${{ matrix.os-name }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          APPIMAGE_EXTRACT_AND_RUN: 1
          DEBUG: electron-builder
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      - name: Validar e Assegurar Assinatura Ad-Hoc nos Bundles (macOS)
        if: runner.os == 'macOS'
        run: |
          find release/ -maxdepth 3 -name "*.app" -exec codesign --force --deep --sign - {} \; 2>/dev/null || true

      - name: Salvar Artefatos Compilados
        uses: actions/upload-artifact@v4
        with:
          name: Cyberdeck-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  android:
    name: Build para Android (.apk)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Requisito Capacitor 8 / Android SDK 36)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar Versão nos Arquivos do Projeto
        shell: bash
        run: node scripts/set-version.js "${{ needs.prepare.outputs.version }}"

      - name: Instalar Dependências
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Compilar Frontend (Vite)
        run: npm run build

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug com Versão Exata
        run: |
          cd android
          ./gradlew assembleDebug -PversionName=${{ needs.prepare.outputs.version }} -PversionCode=${{ needs.prepare.outputs.build_number }} --no-daemon

      - name: Organizar APK para Artefatos com Nome da Versão
        shell: bash
        run: |
          mkdir -p release-android
          find android/app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} release-android/Cyberdeck-CRT-Terminal-${{ needs.prepare.outputs.version }}.apk \;
          echo "=== APK gerado com a versão ==="
          ls -lh release-android/

      - name: Salvar Artefatos Compilados (Android APK)
        uses: actions/upload-artifact@v4
        with:
          name: Cyberdeck-Android-APK
          path: release-android/*.apk
          if-no-files-found: warn

  release:
    name: Publicar Release no GitHub
    needs: [prepare, build, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Organizar e listar binários prontos com a versão correta
        shell: bash
        run: |
          mkdir -p dist-releases
          find all-releases -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.apk" \) -exec cp {} dist-releases/ \;
          echo "=== Arquivos prontos para o Release ${{ needs.prepare.outputs.tag }} ==="
          ls -lh dist-releases/

      - name: Publicar Release no GitHub com Binários
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Cyberdeck CRT Terminal ${{ needs.prepare.outputs.tag }}
          files: dist-releases/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
