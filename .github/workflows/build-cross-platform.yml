name: Build Cross-Platform Cyberdeck

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar Release no GitHub?'
        type: boolean
        default: true
      tag_name:
        description: 'Tag da versão (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  prepare:
    name: Determinar Versão da Compilação
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.get_version.outputs.version }}
      tag: ${{ steps.get_version.outputs.tag }}
      build_number: ${{ steps.get_version.outputs.build_number }}
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Calcular Versão Exata
        id: get_version
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ -n "${{ github.event.inputs.tag_name }}" ]; then
            RAW_TAG="${{ github.event.inputs.tag_name }}"
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            RAW_TAG="${{ github.ref_name }}"
          else
            # Versão base do package.json combinada com o número de execução
            BASE_VER=$(node -p "require('./package.json').version")
            RAW_TAG="v${BASE_VER}.${{ github.run_number }}"
          fi

          # Versão limpa (sem 'v') para package.json e nomes de binários
          CLEAN_VER="${RAW_TAG#v}"
          FINAL_TAG="v${CLEAN_VER}"

          echo "version=${CLEAN_VER}" >> $GITHUB_OUTPUT
          echo "tag=${FINAL_TAG}" >> $GITHUB_OUTPUT
          echo "build_number=${{ github.run_number }}" >> $GITHUB_OUTPUT
          echo "=== Versão calculada: ${CLEAN_VER} | Tag: ${FINAL_TAG} | Build #${{ github.run_number }} ==="

  build:
    name: Build para ${{ matrix.os-name }}
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows (.exe)
            builder-args: --win --x64
          - os: ubuntu-latest
            os-name: Linux (.AppImage)
            builder-args: --linux AppImage
          - os: macos-latest
            os-name: macOS (.dmg / .zip)
            builder-args: --mac

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar Versão nos Arquivos do Projeto
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n', 'utf8');
            console.log('Versão atualizada no package.json para: ' + pkg.version);
          "

      - name: Instalar Dependências
        shell: bash
        run: |
          # Remove package-lock.json gerado em outro OS para evitar o bug do npm (#4828) que omite binários nativos do Rolldown
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Garantir Binários Nativos da Plataforma (Vite/Rolldown)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm install --no-save @rolldown/binding-win32-x64-msvc@1.2.15 || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm install --no-save @rolldown/binding-darwin-arm64@1.2.15 @rolldown/binding-darwin-x64@1.2.15 || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npm install --no-save @rolldown/binding-linux-x64-gnu@1.2.15 || true
          fi

      - name: Compilar Frontend (Vite)
        run: npm run build

      - name: Limpar atributos estendidos (macOS)
        if: runner.os == 'macOS'
        run: xattr -cr . || true

      - name: Compilar Aplicativo Desktop (${{ matrix.os-name }})
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      - name: Salvar Artefatos Compilados
        uses: actions/upload-artifact@v4
        with:
          name: Cyberdeck-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  android:
    name: Build para Android (.apk)
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Requisito Capacitor 8 / Android SDK 36)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Sincronizar Versão nos Arquivos do Projeto
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf8'));
            pkg.version = '${{ needs.prepare.outputs.version }}';
            fs.writeFileSync('package.json', JSON.stringify(pkg, null, 2) + '\n', 'utf8');
            console.log('Versão atualizada no package.json para: ' + pkg.version);
          "

      - name: Instalar Dependências
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Compilar Frontend (Vite)
        run: npm run build

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug com Versão Exata
        run: |
          cd android
          ./gradlew assembleDebug -PversionName=${{ needs.prepare.outputs.version }} -PversionCode=${{ needs.prepare.outputs.build_number }} --no-daemon

      - name: Organizar APK para Artefatos com Nome da Versão
        shell: bash
        run: |
          mkdir -p release-android
          find android/app/build/outputs/apk/debug/ -type f -name "*.apk" -exec cp {} release-android/Cyberdeck-CRT-Terminal-${{ needs.prepare.outputs.version }}.apk \;
          echo "=== APK gerado com a versão ==="
          ls -lh release-android/

      - name: Salvar Artefatos Compilados (Android APK)
        uses: actions/upload-artifact@v4
        with:
          name: Cyberdeck-Android-APK
          path: release-android/*.apk
          if-no-files-found: warn

  release:
    name: Publicar Release no GitHub
    needs: [prepare, build, android]
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Organizar e listar binários prontos com a versão correta
        shell: bash
        run: |
          mkdir -p dist-releases
          find all-releases -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.apk" \) -exec cp {} dist-releases/ \;
          echo "=== Arquivos prontos para o Release ${{ needs.prepare.outputs.tag }} ==="
          ls -lh dist-releases/

      - name: Publicar Release no GitHub com Binários
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          name: Cyberdeck CRT Terminal ${{ needs.prepare.outputs.tag }}
          files: dist-releases/*
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          generate_release_notes: true
          target_commitish: ${{ github.sha }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
