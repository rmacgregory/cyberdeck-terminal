name: Build Cross-Platform Cyberdeck

on:
  workflow_dispatch:
    inputs:
      create_release:
        description: 'Publicar Release no GitHub?'
        type: boolean
        default: true
      tag_name:
        description: 'Tag da versão (ex: v1.0.0)'
        required: false
        default: 'v1.0.0'
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build para ${{ matrix.os-name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            os-name: Windows (.exe)
            builder-args: --win --x64
          - os: ubuntu-latest
            os-name: Linux (.AppImage)
            builder-args: --linux AppImage
          - os: macos-latest
            os-name: macOS (.dmg / .zip)
            builder-args: --mac

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências
        shell: bash
        run: |
          # Remove package-lock.json gerado em outro OS para evitar o bug do npm (#4828) que omite binários nativos do Rolldown
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Garantir Binários Nativos da Plataforma (Vite/Rolldown)
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Windows" ]; then
            npm install --no-save @rolldown/binding-win32-x64-msvc@1.2.15 || true
          elif [ "${{ runner.os }}" = "macOS" ]; then
            npm install --no-save @rolldown/binding-darwin-arm64@1.2.15 @rolldown/binding-darwin-x64@1.2.15 || true
          elif [ "${{ runner.os }}" = "Linux" ]; then
            npm install --no-save @rolldown/binding-linux-x64-gnu@1.2.15 || true
          fi

      - name: Compilar Frontend (Vite)
        run: npm run build

      - name: Limpar atributos estendidos (macOS)
        if: runner.os == 'macOS'
        run: xattr -cr . || true

      - name: Compilar Aplicativo Desktop (${{ matrix.os-name }})
        env:
          # Desativa a busca obrigatória por certificados pagos (Apple/Microsoft) para compilar sem erros de assinatura
          CSC_IDENTITY_AUTO_DISCOVERY: false
          DEBUG: electron-builder
        run: npx electron-builder ${{ matrix.builder-args }} --publish never

      - name: Salvar Artefatos Compilados
        uses: actions/upload-artifact@v4
        with:
          name: Cyberdeck-${{ matrix.os }}
          path: |
            release/*.exe
            release/*.AppImage
            release/*.dmg
            release/*.zip
          if-no-files-found: warn

  android:
    name: Build para Android (.apk)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Java 21 (Requisito Capacitor 8 / Android SDK 36)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Instalar Dependências
        shell: bash
        run: |
          rm -f package-lock.json
          npm install --legacy-peer-deps

      - name: Compilar Frontend (Vite)
        run: npm run build

      - name: Sincronizar Capacitor com Android
        run: npx cap sync android

      - name: Permissão de execução para o Gradle
        run: chmod +x android/gradlew

      - name: Compilar APK Debug
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon

      - name: Organizar APK para Artefatos
        run: |
          mkdir -p release-android
          cp android/app/build/outputs/apk/debug/app-debug.apk release-android/Cyberdeck-Terminal-Android-debug.apk

      - name: Salvar Artefatos Compilados (Android APK)
        uses: actions/upload-artifact@v4
        with:
          name: Cyberdeck-Android-APK
          path: release-android/*.apk
          if-no-files-found: warn

  release:
    name: Publicar Release no GitHub
    needs: [build, android]
    if: startsWith(github.ref, 'refs/tags/') || (github.event_name == 'workflow_dispatch' && github.event.inputs.create_release != 'false')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Determinar Tag do Release
        id: release_info
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.tag_name }}"
            if [ -z "$TAG" ]; then
              TAG="v1.0.${{ github.run_number }}"
            fi
          else
            TAG="${{ github.ref_name }}"
          fi
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "Tag definida: $TAG"

      - name: Baixar todos os artefatos compilados
        uses: actions/download-artifact@v4
        with:
          path: all-releases

      - name: Organizar e listar binários prontos
        run: |
          mkdir -p dist-releases
          find all-releases -type f \( -name "*.exe" -o -name "*.AppImage" -o -name "*.dmg" -o -name "*.zip" -o -name "*.apk" \) -exec cp {} dist-releases/ \;
          echo "=== Arquivos prontos para o Release ==="
          ls -lh dist-releases/

      - name: Publicar Release no GitHub com Binários
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_info.outputs.tag }}
          name: Cyberdeck Terminal ${{ steps.release_info.outputs.tag }}
          files: dist-releases/*
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

